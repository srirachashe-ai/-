html{color-scheme:light}body{margin:0;font-size:14px}[hidden]{display:none!important}img{max-width:100%}

/* Layout: phone-width app for duty staff, wide console for administrators. CPF blue-to-green gradient bands, gold accent from the logo. */
:root{
  --bg:#EEF3F8; --surface:#FFFFFF; --sunk:#F3F6FA; --ink:#13233A; --muted:#566880; --line:#DCE4EE;
  --navy:#0E3B85; --navy-2:#2C5BA6; --on-navy:#FFFFFF; --on-navy-muted:#D5E2F4;
  --safety:#E2B235; --on-safety:#13284A; --gold-l:#F5D77E;
  --grad:linear-gradient(135deg,#0A2D6B 0%,#13509C 50%,#15814A 100%);
  --grad-btn:linear-gradient(135deg,#13509C 0%,#15814A 100%);
  --grad-gold:linear-gradient(135deg,#F0C64E 0%,#D69A1C 100%);
  --grad-soft:linear-gradient(135deg,rgba(19,80,156,.09),rgba(21,129,74,.09));
  --glow1:rgba(19,80,156,.12); --glow2:rgba(21,129,74,.11);
  --shadow:0 1px 2px rgba(14,40,80,.05),0 8px 24px rgba(14,40,80,.07);
  --good:#15703F; --good-bg:#E1F3E8; --bad:#B3261E; --bad-bg:#FCEAE8; --warn:#7A5200; --warn-bg:#FFF3D3; --info:#13468F; --info-bg:#E3ECF9;
  --font:'IBM Plex Sans Thai',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#08121F; --surface:#101C2F; --sunk:#0C1727; --ink:#E6EDF6; --muted:#9DB0C8; --line:#22334D;
  --navy:#1B4A94; --navy-2:#2E5590; --on-navy:#FFFFFF; --on-navy-muted:#BFD0E8;
  --safety:#E9C25A; --on-safety:#13284A; --gold-l:#F5D77E;
  --grad:linear-gradient(135deg,#0A2558 0%,#103F7C 50%,#0F6038 100%);
  --grad-btn:linear-gradient(135deg,#1C58A8 0%,#178A4F 100%);
  --grad-gold:linear-gradient(135deg,#F0C64E 0%,#D69A1C 100%);
  --grad-soft:linear-gradient(135deg,rgba(60,120,210,.14),rgba(40,170,100,.12));
  --glow1:rgba(40,100,200,.16); --glow2:rgba(30,150,90,.12);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  --good:#6FD39A; --good-bg:#12301F; --bad:#FF8F85; --bad-bg:#3A1714; --warn:#F2C860; --warn-bg:#352808; --info:#A9C7F0; --info-bg:#16284A;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#08121F; --surface:#101C2F; --sunk:#0C1727; --ink:#E6EDF6; --muted:#9DB0C8; --line:#22334D;
  --navy:#1B4A94; --navy-2:#2E5590; --on-navy:#FFFFFF; --on-navy-muted:#BFD0E8;
  --safety:#E9C25A; --on-safety:#13284A; --gold-l:#F5D77E;
  --grad:linear-gradient(135deg,#0A2558 0%,#103F7C 50%,#0F6038 100%);
  --grad-btn:linear-gradient(135deg,#1C58A8 0%,#178A4F 100%);
  --grad-gold:linear-gradient(135deg,#F0C64E 0%,#D69A1C 100%);
  --grad-soft:linear-gradient(135deg,rgba(60,120,210,.14),rgba(40,170,100,.12));
  --glow1:rgba(40,100,200,.16); --glow2:rgba(30,150,90,.12);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  --good:#6FD39A; --good-bg:#12301F; --bad:#FF8F85; --bad-bg:#3A1714; --warn:#F2C860; --warn-bg:#352808; --info:#A9C7F0; --info-bg:#16284A;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:radial-gradient(900px 480px at -10% -10%,var(--glow1),transparent 60%),radial-gradient(800px 480px at 110% 0%,var(--glow2),transparent 60%),var(--bg);background-attachment:fixed;color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 24px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:#0A2D6B}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.3}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--safety);outline-offset:2px}
.wrap{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.wrap.wide{max-width:1120px}
.demo{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;font-size:12px;color:var(--muted);padding-block:10px 0}
.demo .row{min-width:0;max-width:100%}
.demo select{min-width:0;flex:1 1 150px;width:100%;min-height:36px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:0 8px;max-width:100%}
.demo .tag{font-size:11px;background:var(--warn-bg);color:var(--warn);padding:3px 8px;border-radius:6px}
.band{background:var(--grad);color:var(--on-navy);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden;box-shadow:0 10px 30px rgba(10,45,107,.22);isolation:isolate}
.band::before{content:"";position:absolute;right:-70px;top:-90px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.16),rgba(255,255,255,0) 70%);z-index:-1}
.band::after{content:"";position:absolute;left:18px;right:18px;bottom:0;height:3px;border-radius:3px 3px 0 0;background:var(--grad-gold);opacity:.9}
.band .eyebrow{font-size:12px;font-weight:600;letter-spacing:.02em;color:var(--gold-l)}
.band .eyebrow.en{font-size:11px;letter-spacing:.16em;text-transform:uppercase}
.brand{display:flex;gap:12px;align-items:center;min-width:0}
.brand .t{min-width:0}
.logo{flex-shrink:0;width:48px;height:48px;border-radius:14px;background:#FFFFFF;display:grid;place-items:center;padding:4px;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.logo img,.logo svg{width:100%;height:100%;object-fit:contain;display:block}
.logo.lg{width:96px;height:96px;border-radius:24px;padding:8px}
.hero{align-items:center;text-align:center;padding:28px 18px 26px}
.hero h1{font-size:23px}
.band .sub{color:var(--on-navy-muted);font-size:13px}
.who{display:flex;gap:12px;align-items:center}
.avatar{width:46px;height:46px;border-radius:50%;background:var(--grad-gold);color:var(--on-safety);box-shadow:0 0 0 3px rgba(255,255,255,.25);font-weight:700;display:grid;place-items:center;flex-shrink:0}
.iconbtn{min-width:44px;min-height:44px;border-radius:12px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.1);color:var(--on-navy);display:grid;place-items:center}
.row{display:flex;gap:10px;align-items:center}
.between{justify-content:space-between}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
.card.flush{padding:0;overflow:hidden}
.card h2{font-size:17px}
.muted{color:var(--muted)} .small{font-size:13px} .tiny{font-size:12px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;white-space:nowrap}
.p-good{background:var(--good-bg);color:var(--good)} .p-bad{background:var(--bad-bg);color:var(--bad)} .p-warn{background:var(--warn-bg);color:var(--warn)} .p-info{background:var(--info-bg);color:var(--info)}
.btn{min-height:48px;border-radius:12px;transition:filter .15s,transform .05s;border:1.5px solid var(--line);background:var(--surface);font-weight:600;padding:0 14px}
.btn.primary{background:var(--grad-btn);border-color:transparent;color:#fff;box-shadow:0 6px 16px rgba(19,80,156,.25)}
.btn:not(:disabled):active{transform:translateY(1px)}
.btn.primary:not(:disabled):hover,.btn.safety:not(:disabled):hover{filter:brightness(1.06)}
.btn.safety{background:var(--grad-gold);border-color:transparent;color:var(--on-safety);font-weight:700;box-shadow:0 6px 16px rgba(214,154,28,.28)}
.btn.big{min-height:62px;font-size:18px;width:100%}
.btn.on-good{background:var(--good);border-color:var(--good);color:#fff}
.btn.on-bad{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.on-mid{background:var(--muted);border-color:var(--muted);color:var(--surface)}
.btn.on-navy{background:var(--grad-btn);border-color:transparent;color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.dash{border-style:dashed;border-color:var(--navy);color:var(--info);background:var(--sunk)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
label{font-size:13px;font-weight:600;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:6px}
input[type=text],input[type=password],input[type=time],input:not([type]),textarea,select.inp{min-height:48px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);padding:8px 12px;width:100%}
textarea{min-height:64px;resize:vertical}
input:focus,textarea:focus{border-color:var(--navy);outline:none;box-shadow:0 0 0 3px var(--info-bg)}
.choice{padding:12px;border-radius:12px;display:flex;flex-direction:column;gap:10px}
.c-good{background:var(--good-bg)} .c-bad{background:var(--bad-bg)} .c-info{background:var(--info-bg)}
.list{display:flex;flex-direction:column}
.li{flex-wrap:wrap;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .pill{white-space:normal;max-width:100%}
.li .name{min-width:0}
.result{width:100%;min-height:52px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);text-align:left;padding:6px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.result.sel{border-color:var(--navy);background:var(--info-bg)}
.progress{height:8px;border-radius:99px;background:rgba(255,255,255,.22);overflow:hidden}
.progress>i{display:block;height:100%;background:var(--grad-gold)}
.area{border:1.5px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.area.bad{border-color:var(--bad)}
.area-head{display:flex;align-items:center;gap:10px;padding:8px 10px 8px 12px}
.area-head .open{flex:1;min-width:0;min-height:44px;border:0;background:none;text-align:left;padding:0}
.no{width:28px;height:28px;border-radius:8px;background:var(--sunk);font-size:12px;font-weight:700;display:grid;place-items:center;flex-shrink:0}
.no.good{background:var(--good);color:#fff} .no.bad{background:var(--bad);color:#fff}
.area-body{border-top:1px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:38px;padding:0 12px;border-radius:99px;border:1.5px solid var(--line);background:var(--surface);font-size:13px}
.chip.on{background:var(--grad-btn);border-color:transparent;color:var(--on-navy)}
.chip.on-bad{background:var(--bad);border-color:var(--bad);color:#fff}
.nav{position:sticky;bottom:8px;z-index:5;margin-top:8px;background:color-mix(in srgb,var(--surface) 90%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:20px;padding-inline:4px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -6px 20px rgba(15,42,71,.08)}
.nav button{min-height:62px;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;color:var(--muted)}
.nav button{border-radius:14px;margin-block:4px}
.nav button.act{color:var(--info);font-weight:700;background:var(--grad-soft)}
.nav button{position:relative}.nav button.lock{opacity:.55}.nav .dot2{position:absolute;top:8px;right:calc(50% - 20px);width:9px;height:9px;border-radius:50%;background:var(--bad);box-shadow:0 0 0 2px var(--surface)}.nav .lk{position:absolute;top:6px;right:calc(50% - 22px);font-size:10px}
.nav svg,.ico{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}
.cal .wd{font-size:12px;font-weight:600;color:var(--muted)}
.cal button{min-height:44px;border-radius:10px;border:2px solid transparent;background:var(--surface);font-weight:500;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.cal button.sun{background:var(--info-bg);color:var(--info);font-weight:700}
.cal button.hol{background:var(--warn-bg);color:var(--warn);font-weight:700}
.cal button.mine{border-color:var(--safety)}
.cal button.sel{background:var(--grad-btn);color:#fff}
.cal button.dim{opacity:.35}
.cal .dot{width:5px;height:5px;border-radius:50%;background:var(--bad)}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tabs button{min-height:42px;padding:0 14px;border-radius:99px;border:1.5px solid rgba(255,255,255,.3);background:transparent;color:var(--on-navy);font-weight:600}
.tabs button.act{background:#FFFFFF;border-color:#FFFFFF;color:#0E3B85}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:14px;padding:12px 14px}
.kpi b{display:block;font-size:30px;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi.k-good{border-top:4px solid var(--good)} .kpi.k-bad{border-top:4px solid var(--bad)} .kpi.k-warn{border-top:4px solid var(--safety)} .kpi.k-info{border-top:4px solid var(--navy-2)}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:640px}
th{font-size:12px;color:var(--muted);text-align:left;font-weight:600;padding:8px;border-bottom:1px solid var(--line)}
td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
tr.badrow td{background:var(--bad-bg)}
.cabgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.cab{min-height:70px;border-radius:12px;border:2px solid var(--line);background:var(--surface);text-align:left;padding:8px 10px;display:flex;flex-direction:column;gap:2px}
.cab.fresh{border-color:var(--good)}
.cab.on{background:var(--grad-btn);border-color:transparent;color:var(--on-navy)}
.cab .code{font-family:var(--mono);font-weight:600;font-size:14px}
.cols{display:flex;flex-wrap:wrap;gap:14px}
.cols>*{flex:1 1 340px;min-width:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:10px;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.shot{display:flex;gap:10px;align-items:center}
.shot img{width:72px;height:72px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.shot .btn{flex:1;display:flex;align-items:center;justify-content:center;gap:8px}
.err{color:var(--bad);font-size:13px;font-weight:600}
.extra{border-color:var(--safety)}
/* status colours: a coloured bar on the left and a soft tint, so a long list can be read at a glance */
.st-done,.st-bad,.st-wait,.st-info{border-left-width:6px!important}
.st-done{border-left-color:var(--good)!important;background:linear-gradient(90deg,var(--good-bg) 0,var(--surface) 70%)}
.st-bad{border-left-color:var(--bad)!important;background:linear-gradient(90deg,var(--bad-bg) 0,var(--surface) 70%)}
.st-wait{border-left-color:var(--safety)!important}
.st-info{border-left-color:var(--navy-2)!important;background:linear-gradient(90deg,var(--info-bg) 0,var(--surface) 70%)}
.area{border-left-width:6px}
.area:nth-child(even){background:var(--sunk)}
.area.ok{border-left-color:var(--good);background:linear-gradient(90deg,var(--good-bg) 0,transparent 55%)}
.area.part{border-left-color:var(--safety)}
.area.bad{border-left-color:var(--bad);background:linear-gradient(90deg,var(--bad-bg) 0,transparent 70%)}
.kind{display:inline-flex;font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;background:var(--sunk);color:var(--muted)}
.kind.x{background:var(--warn-bg);color:var(--warn)}
.photo-ok{font-size:12px;font-weight:600;color:var(--good)}
@media (prefers-reduced-motion: no-preference){.card,.area{transition:border-color .15s}}
</style>

const toMin=t=>{const p=String(t||'').split(':');return +p[0]*60+ +p[1]};
function hrs(a,b){if(!a||!b)return '–';const d=toMin(b)-toMin(a);return d>0?Math.floor(d/60)+' ชม. '+pad(d%60)+' น.':'–'}

function distM(a,b,c,d){const R=6371000,r=x=>x*Math.PI/180,dl=r(c-a),dn=r(d-b),h=Math.sin(dl/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h))}

function slots(date){const r=RMAP[date];if(!r)return[];return [...r.leaders.map(n=>({name:n,code:codeOf(n),role:'หัวหน้าเวร'})),...r.members.map(n=>({name:n,code:codeOf(n),role:'ลูกเวร'}))]}
function myDuty(date,me){
  for(const s of slots(date)){if(s.code===me)return{slot:s,kind:'owner'}}
  for(const s of slots(date)){const a=S.att[date+'|'+s.code];if(a&&a.st==='sub'&&a.sub===me)return{slot:s,kind:'sub'}}
  return null}

/* the duty the administrator looks at: today, or the last duty while it can still be updated */
function awd(){const ds=ROSTER.map(r=>r[0]).filter(d=>d<=TODAY&&(d===TODAY||TODAY<=deadlineOf(d)));return ds.length?ds[ds.length-1]:TODAY}
function graceNote(){const D=wd();return D===TODAY?'':`<div class="choice c-info"><b class="small">บันทึกผลเวร ${dTH(D)} (ย้อนหลัง)</b><span class="tiny">แก้ไขและเพิ่มผลได้ถึง ${dTH(deadlineOf(D))} เวลา 23:59 น. หลังจากนั้นระบบจะปิดการบันทึกของเวรนี้</span></div>`}
function planDates(){const hi=addDays(TODAY,PLAN_DAYS);return ROSTER.map(r=>r[0]).filter(d=>d>TODAY&&d<=hi)}
function subSlotOf(d,me){return slots(d).find(s=>{const p=S.plans[d+'|'+s.code];return p&&p.plan==='sub'&&p.sub===me})}
function myPlanDates(me){return planDates().filter(d=>slots(d).some(s=>s.code===me)||subSlotOf(d,me))}
function planPending(me){return myPlanDates(me).some(d=>{if(slots(d).some(s=>s.code===me))return !S.plans[d+'|'+me];const sl=subSlotOf(d,me);return sl&&!S.plans[d+'|'+sl.code].acc})}
/* a plan made in advance shows on the duty day like a status, until the person confirms in person */
function syncPlans(){Object.keys(S.att).forEach(k=>{if(S.att[k]&&S.att[k].planned==='plan')delete S.att[k]});
  Object.entries(S.plans||{}).forEach(([k,p])=>{if(S.att[k])return;
    if(p.plan==='sub'&&p.sub)S.att[k]={st:'sub',sub:p.sub,at:'',by:p.by||'',setBy:p.by==='admin'?'admin':'',planned:'plan'};
    else if(p.plan==='leave')S.att[k]={st:'absent',why:'แจ้งลาล่วงหน้า: '+(p.why||''),at:'',by:p.by||'',planned:'plan'}})}
function planBlock(d){
  const me=S.user,u=S.ui,ss=slots(d),mineS=ss.find(s=>s.code===me),subFor=subSlotOf(d,me);
  const lab=p=>!p?['p-warn','รอยืนยัน']:p.plan==='come'?['p-good','ยืนยันเข้าเวร']:p.plan==='sub'?['p-info','มีผู้เข้าแทน · '+short(p.sub)+(p.acc?' ✓':'')]:['p-bad','แจ้งลา'];
  const rows=ss.map(s=>{const p=s.code?S.plans[d+'|'+s.code]:null,[c,t]=s.code?lab(p):['p-bad','ตำแหน่งว่าง'];
    return `<div class="li"><span class="name">${s.code===me?'<b>คุณ'+esc(s.name)+' (ท่าน)</b>':'คุณ'+esc(s.name)}<div class="tiny muted">${s.role}${p&&p.at?' · แจ้งเมื่อ '+esc(p.at):''}</div></span><span class="pill ${c}">${esc(t)}</span></div>`}).join('');
  let form='';
  if(mineS){const p=S.plans[d+'|'+me],ed=u.planEdit===d||!p,c=u.planChoice||'';
    if(!ed)form=`<div class="choice ${p.plan==='come'?'c-good':p.plan==='leave'?'c-bad':'c-info'}"><b class="small">ท่านแจ้งไว้: ${p.plan==='come'?'จะเข้าเวร':p.plan==='sub'?'มีผู้เข้าแทน คือ '+nm(p.sub)+(p.acc?' (รับทราบแล้ว)':' (รอผู้เข้าแทนรับทราบ)'):'ลา · '+esc(p.why||'')}</b><button class="btn" data-act="planEdit" data-d="${d}">เปลี่ยนแปลง</button></div>`;
    else{const onDuty=new Set(ss.map(x=>x.code)),q=(u.pq||'').trim(),res=q?EMP.filter(e=>!onDuty.has(e[0])&&(e[2].includes(q)||e[0].includes(q))).slice(0,6):[];
      form=`<div class="small" style="font-weight:600">แจ้งการเข้าเวรของท่าน</div>
      <div class="grid3"><button class="btn ${c==='come'?'on-good':''}" data-act="planChoose" data-c="come">จะเข้าเวร</button><button class="btn ${c==='sub'?'on-navy':''}" data-act="planChoose" data-c="sub">มีผู้เข้าแทน</button><button class="btn ${c==='leave'?'on-bad':''}" data-act="planChoose" data-c="leave">ลา</button></div>
      ${c==='sub'?`<div class="choice c-info"><div class="field"><label for="pq">ค้นหาชื่อหรือรหัสพนักงานของผู้เข้าเวรแทน</label><input id="pq" data-bind="pq" data-live value="${esc(u.pq||'')}" placeholder="พิมพ์ชื่อ หรือ รหัสพนักงาน"></div>${res.map(e=>`<button class="result ${u.ppick===e[0]?'sel':''}" data-act="planPick" data-code="${e[0]}"><span><b>คุณ${esc(e[2])}</b><br><span class="tiny muted mono">${e[0]}</span><span class="tiny muted">${e[3]?' · '+esc(e[3]):''}</span></span>${u.ppick===e[0]?'<span class="pill p-info">เลือกแล้ว</span>':''}</button>`).join('')}${q&&!res.length?'<div class="tiny muted">ไม่พบพนักงานที่สามารถเข้าเวรแทนได้</div>':''}<div class="tiny muted">ผู้เข้าเวรแทนจะเห็นรายการนี้เมื่อเข้าสู่ระบบ และต้องกดรับทราบ</div></div>`:''}
      ${c==='leave'?`<div class="choice c-bad"><div class="field"><label for="pwhy">เหตุผลการลา (จำเป็น)</label><input id="pwhy" data-bind="pwhy" data-live value="${esc(u.pwhy||'')}" placeholder="เช่น ลาพักร้อน ติดธุระต่างจังหวัด"></div><div class="tiny muted">หากยังไม่มีผู้เข้าแทน ผู้ดูแลระบบจะเห็นรายการนี้เพื่อจัดหาผู้เข้าเวรแทน</div></div>`:''}
      ${c||p?`<div class="grid2">${p?'<button class="btn" data-act="planCancel">ยกเลิก</button>':''}<button class="btn primary" style="${p?'':'grid-column:1/-1'}" data-act="planSave" data-d="${d}" ${!c||(c==='sub'&&!u.ppick)||(c==='leave'&&(u.pwhy||'').trim().length<2)?'disabled':''}>บันทึกการแจ้ง</button></div>`:''}`}}
  else if(subFor){const p=S.plans[d+'|'+subFor.code];
    form=`<div class="choice c-info"><b class="small">คุณ${esc(subFor.name)} ระบุให้ท่านเข้าเวรแทน (${subFor.role})</b>${p.acc?'<span class="small">✓ ท่านรับทราบแล้ว · วันเข้าเวรกรุณาลงชื่อพร้อมรูปถ่ายในหน้านี้</span>':`<button class="btn on-good" data-act="planAccept" data-d="${d}" data-code="${subFor.code}">รับทราบ · ยืนยันเข้าเวรแทน</button><div class="tiny muted">หากไม่สามารถเข้าแทนได้ กรุณาแจ้งคุณ${esc(subFor.name.split(' ')[0])}โดยตรง</div>`}</div>`}
  return `<div class="card" style="border:2px solid var(--safety)"><div><div class="tiny" style="font-weight:700;color:var(--warn)">ยืนยันเวรล่วงหน้า</div><h2>${dTH(d)}</h2><div class="small muted">${esc((RMAP[d]&&RMAP[d].type)||'เวรวันอาทิตย์')} · แจ้งได้จนถึงก่อนวันเข้าเวร · ในวันเข้าเวรต้องลงชื่อพร้อมรูปถ่ายอีกครั้ง</div></div>${form}<div class="tiny muted" style="font-weight:700">รายชื่อเวรวันดังกล่าว</div><div class="list">${rows}</div></div>`}
function aPlans(){const u=S.ui;
  return planDates().map(d=>{const ss=slots(d);
    const rows=ss.map(s=>{const k=d+'|'+s.code,p=s.code?S.plans[k]:null;
      const st=!s.code?'<span class="pill p-bad">ตำแหน่งว่าง</span>':!p?'<span class="pill p-warn">ยังไม่ยืนยัน</span>':p.plan==='come'?'<span class="pill p-good">ยืนยันเข้าเวร</span>':p.plan==='sub'?'<span class="pill p-info">มีผู้เข้าแทน</span>':'<span class="pill p-bad">แจ้งลา</span>';
      const det=p?(p.plan==='sub'?'<b>'+nm(p.sub)+'</b>'+(p.acc?' · รับทราบแล้ว':' · รอรับทราบ'):p.plan==='leave'?esc(p.why||''):'–')+'<div class="tiny muted">'+esc(p.at||'')+(p.by==='admin'?' · ระบุโดยผู้ดูแลระบบ':'')+'</div>':'–';
      const act=s.code&&(!p||p.plan==='leave')?(u.pSubFor===k?`<div class="choice c-info" style="min-width:260px">${empPicker(u.aq2||'',u.apick2,'aPlanPick','aq2','aq2',new Set(ss.map(x=>x.code)))}<div class="grid2"><button class="btn primary" data-act="aPlanSave" data-k="${k}" ${u.apick2?'':'disabled'}>บันทึก</button><button class="btn" data-act="aPlanOpen" data-k="">ยกเลิก</button></div></div>`:`<button class="btn" style="min-height:38px" data-act="aPlanOpen" data-k="${k}">ระบุผู้เข้าเวรแทน</button>`):'';
      return `<tr class="${p&&p.plan==='leave'?'badrow':''}"><td>คุณ${esc(s.name)}</td><td>${s.role}</td><td>${st}</td><td>${det}</td><td>${act}</td></tr>`}).join('');
    const n=ss.filter(s=>s.code&&S.plans[d+'|'+s.code]).length,lv=ss.filter(s=>{const p=S.plans[d+'|'+s.code];return p&&p.plan==='leave'}).length;
    return `<div class="card"><div class="row between" style="flex-wrap:wrap"><h2>การยืนยันเวรล่วงหน้า · ${dTH(d)}</h2><span class="row" style="gap:6px">${lv?'<span class="pill p-bad">แจ้งลา '+lv+' คน · ต้องจัดผู้เข้าแทน</span>':''}<span class="pill ${n===ss.length?'p-good':'p-warn'}">ยืนยันแล้ว ${n}/${ss.length}</span></span></div><div class="tbl"><table><thead><tr><th>ชื่อตามตารางเวร</th><th>บทบาท</th><th>สถานะ</th><th>รายละเอียด</th><th>จัดการ</th></tr></thead><tbody>${rows}</tbody></table></div></div>`}).join('')}
/* people actually on site today (owner who came, or the substitute who came) */
function present(date){return slots(date).map(s=>{const a=S.att[date+'|'+s.code];if(!a)return null;
  if(a.st==='come')return{code:s.code,role:s.role,out:!!a.out};
  if(a.st==='sub'){const b=S.att[date+'|'+a.sub];if(b&&b.st==='come')return{code:a.sub,role:s.role,out:!!b.out}}return null}).filter(Boolean)}
/* who takes the team photo: the leader on site; if no leader came, any member on site */
function teamShooters(date){const p=present(date),L=p.filter(x=>x.role==='หัวหน้าเวร');return (L.length?L:p).map(x=>x.code)}
function seedTeam(){const t={};ROSTER.forEach(r=>{const d=r[0];if(d>=TODAY||d==='2026-10-18')return;const p=present(d);if(!p.length)return;
  const L=p.find(x=>x.role==='หัวหน้าเวร')||p[0],o=p.filter(x=>x.code!==L.code);t[d]={at:'16:'+String(20+(+d.slice(8))%30).padStart(2,'0'),by:L.code,codes:o.map(x=>x.code),total:o.length}});return t}
function slotStatus(date,s){
  if(!s.code)return{pill:'p-bad',txt:RESIGNED.includes(s.name)?'ลาออก':'ไม่พบรหัส',sub:''};
  const a=S.att[date+'|'+s.code];
  if(!a)return{pill:'p-warn',txt:'รอยืนยัน',sub:''};
  if(a.st==='come')return{pill:'p-good',txt:'เข้าเวรแล้ว '+a.at.slice(0,5),sub:'',at:a.at,by:a.by};
  if(a.st==='absent')return{pill:'p-bad',txt:a.planned?'แจ้งลาล่วงหน้า':'ไม่เข้าเวร',sub:a.why,at:a.at,by:a.by};
  const b=S.att[date+'|'+a.sub];
  return{pill:'p-info',txt:b&&b.st==='come'?'ผู้เข้าแทนมาแล้ว '+b.at.slice(0,5):'มีผู้เข้าแทน · รอยืนยัน',sub:'แทนโดย '+nm(a.sub),at:a.at,by:a.by,subAt:b&&b.at}}
function nextDuty(me){return ROSTER.map(r=>r[0]).filter(d=>d>TODAY).find(d=>slots(d).some(s=>s.code===me))}
const isAdmin=()=>!!S.admin;
async function hashPw(pw){const salt='srf-admin-v1:';try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(salt+pw));return Array.from(new Uint8Array(b),x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return 'plain:'+pw}}

/* stamp name + date + time onto the photo, like a timestamp camera */
function stampPhoto(file,cb,label){
  const fr=new FileReader();fr.onload=()=>{const img=new Image();img.onload=()=>{
    const W=Math.min(1080,img.width),H=Math.round(img.height*W/img.width);const cv=document.createElement('canvas');cv.width=W;cv.height=H;const x=cv.getContext('2d');
    x.drawImage(img,0,0,W,H);const e=byCode[S.user],now=new Date(),t=clock();
    const fs=Math.max(18,Math.round(W/26)),bh=fs*4.4;x.fillStyle='rgba(10,30,53,.78)';x.fillRect(0,H-bh,W,bh);
    x.fillStyle='#F2A900';x.fillRect(0,H-bh,W,Math.max(4,fs/5));
    x.fillStyle='#FFFFFF';x.font=`700 ${fs}px "IBM Plex Sans Thai",Tahoma,sans-serif`;x.fillText('คุณ'+e[2]+'  ('+e[0]+')',fs*.7,H-bh+fs*1.5);
    x.font=`600 ${fs*.9}px "IBM Plex Sans Thai",Tahoma,sans-serif`;x.fillText(dTH(TODAY)+'  เวลา '+t+' น.',fs*.7,H-bh+fs*2.7);
    x.fillStyle='#F2C860';x.font=`500 ${fs*.75}px "IBM Plex Sans Thai",Tahoma,sans-serif`;x.fillText((label||'ลงชื่อรับทราบเข้าเวร')+' · SRF Safety Duty',fs*.7,H-bh+fs*3.8);
    cb(cv.toDataURL('image/jpeg',.82),t)};img.onerror=()=>toast('ไม่สามารถเปิดรูปได้ กรุณาถ่ายรูปใหม่');img.src=fr.result};fr.readAsDataURL(file)}

function vCal(){
  const c=S.ui.cal,me=S.user,y=c.y,m=c.m;
  const first=new Date(y,m,1).getDay(),dim=new Date(y,m+1,0).getDate(),tot=Math.ceil((first+dim)/7)*7;
  const isMine=d=>slots(d).some(s=>s.code===me);
  let cells='';for(let i=0;i<tot;i++){const n=i-first+1;if(n<1||n>dim){cells+='<span></span>';continue}
    const k=y+'-'+pad(m+1)+'-'+pad(n),r=RMAP[k];const cls=[r?(r.type?'hol':'sun'):'',r&&isMine(k)?'mine':'',k===c.sel?'sel':'',c.mine&&r&&!isMine(k)?'dim':''].join(' ');
    const vac=r&&k>TODAY&&r.members.some(x=>RESIGNED.includes(x));
    cells+=`<button class="${cls}" data-act="calSel" data-d="${k}" aria-label="${n} ${ML[m]}${r?' มีเวร':''}">${n}${vac?'<span class="dot"></span>':''}</button>`}
  const r=RMAP[c.sel];
  const ppl=(arr,lead)=>arr.map(n=>{const res=RESIGNED.includes(n),fut=c.sel>TODAY;const code=codeOf(n);const a=S.att[c.sel+'|'+code];
    return `<div class="li"><span style="${res&&fut?'text-decoration:line-through;color:var(--bad)':''}">คุณ${esc(n)}</span>${res?`<span class="pill ${fut?'p-bad':'p-info'}">${fut?'ลาออก · ต้องจัดผู้เข้าเวรแทน':'ลาออกแล้ว'}</span>`:code===me?'<span class="pill p-warn">คุณ</span>':a&&a.st==='sub'?'<span class="pill p-info">แทนโดย '+short(a.sub)+'</span>':a&&a.st==='absent'?'<span class="pill p-bad">'+(a.planned?'แจ้งลา':'ไม่เข้าเวร')+'</span>':''}</div>`}).join('');
  const list=ROSTER.filter(x=>x[0].startsWith(y+'-'+pad(m+1))&&(!c.mine||isMine(x[0])));
  return `<div class="band" style="padding-top:20px"><div class="eyebrow">ตารางเวรอาสาวันหยุด · ${ROSTER.length} วันเวร</div>
   <div class="row between"><button class="iconbtn" data-act="calMove" data-n="-1" aria-label="เดือนก่อน">‹</button><div style="text-align:center"><h1 style="font-size:20px">${ML[m]} ${y+543}</h1><div class="sub tiny">มีเวร ${list.length} วัน</div></div><button class="iconbtn" data-act="calMove" data-n="1" aria-label="เดือนถัดไป">›</button></div></div>
  <div class="grid2"><button class="btn ${!c.mine?'on-navy':''}" data-act="calMine" data-v="0">เวรทั้งหมด</button><button class="btn ${c.mine?'on-navy':''}" data-act="calMine" data-v="1">เฉพาะเวรของท่าน</button></div>
  <div class="card"><div class="cal">${['อา','จ','อ','พ','พฤ','ศ','ส'].map(w=>`<span class="wd">${w}</span>`).join('')}${cells}</div>
   <div class="row tiny muted" style="flex-wrap:wrap;gap:6px 14px"><span><span class="pill p-info">ฟ้า</span> วันอาทิตย์</span><span><span class="pill p-warn">เหลือง</span> นักขัตฤกษ์</span><span>กรอบสีทอง = เวรของท่าน</span><span>จุดแดง = มีตำแหน่งว่าง</span></div></div>
  <div class="card"><div><h2>${dTH(c.sel)}</h2><div class="small muted">${r?esc(r.type||'เวรวันอาทิตย์'):'ไม่มีเวรอาสาในวันดังกล่าว'}</div></div>
   ${r?`<div class="tiny muted" style="font-weight:700">หัวหน้าเวร</div><div class="list">${ppl(r.leaders)}</div><div class="tiny muted" style="font-weight:700">ลูกเวร (${r.members.length} คน)</div><div class="list">${ppl(r.members)}</div>`:''}</div>
  <div class="list card" style="gap:0">${list.map(x=>`<button class="li" style="border-left:0;border-right:0;border-bottom:0;background:none;width:100%;text-align:left;min-height:52px" data-act="calSel" data-d="${x[0]}"><span><b>${dTH(x[0])}</b><br><span class="tiny muted">คุณ${esc(x[2].join(' / คุณ'))}${x[1]?' · '+esc(x[1]):''}</span></span>${isMine(x[0])?'<span class="pill p-warn">เวรของท่าน</span>':''}</button>`).join('')||'<div class="small muted">ไม่มีเวรในเดือนนี้</div>'}</div>`}

const rateOf=(role,d)=>(role==='หัวหน้าเวร'?+S.cfg.rateA||1500:+S.cfg.rateB||1100)*(isDouble(d)?2:1);
function allowRows(date){
  return slots(date).map(s=>{const a=S.att[date+'|'+s.code];let code=s.code,name=s.name,note='';
    if(a&&a.st==='sub'){code=a.sub;name=byCode[a.sub]?byCode[a.sub][2]:'-';note='แทนคุณ'+s.name}

    const st=!s.code&&!a?'ไม่มีรหัส/ลาออก':a&&a.st==='absent'?'ไม่มา':!came?'ไม่ได้ลงชื่อเข้า':!r.out?'ไม่ได้ลงชื่อออก':'ครบ';
    return {date,role:s.role,type:s.role==='หัวหน้าเวร'?'A':'B',code:code||'-',name,note,inT:came?r.at.slice(0,5):'',outT:came&&r.out?r.out.slice(0,5):'',h:came?hoursNum(r.at,r.out):0,st,came,amt:came?rateOf(s.role,date):0}})}
const thShort=d=>{const t=new Date(d+'T00:00:00');return t.getDate()+' '+MS[t.getMonth()]+' '+(t.getFullYear()+543)};
function monthSummary(ym){
  const days=ROSTER.map(r=>r[0]).filter(d=>d.startsWith(ym)&&d<=TODAY),people={},warn=[];
  days.forEach(d=>{const t=S.team[d];if(!t)warn.push(thShort(d)+' · ไม่มีรูปยืนยันการอยู่เวรจากหัวหน้าเวร');else if(t.codes.length<t.total)warn.push(thShort(d)+' · รูปยืนยันทีม '+t.codes.length+'/'+t.total+' คน');});
  days.forEach(d=>allowRows(d).forEach(r=>{
    if(r.st==='ไม่ได้ลงชื่อออก')warn.push(thShort(d)+' · คุณ'+r.name+' ไม่ได้ลงชื่อออกเวร (ยังจ่ายตามการลงชื่อเข้า)');
    if(r.st==='ไม่ได้ลงชื่อเข้า'&&r.code!=='-')warn.push(thShort(d)+' · คุณ'+r.name+' ไม่ได้ลงชื่อเข้าเวร (ไม่จ่าย)');

    const p=people[r.code]=people[r.code]||{code:r.code,name:r.name,title:byCode[r.code]?byCode[r.code][1]:'',type:'B',cells:{},days:0,amt:0,first:d};

  const list=Object.values(people).sort((a,b)=>a.first.localeCompare(b.first)||(a.type<b.type?-1:1));
  return {days,list,warn,total:list.reduce((x,p)=>x+p.amt,0)}}

  if(isAdmin())html=`<div class="wrap wide">${demoBar()}${vAdmin()}</div>`;

function findCode(id){id=String(id||'').trim().toLowerCase();return EMAILS[id]||(byCode[id]?id:null)}
/* emails are not kept in the page as text; compare a hash of what was typed */
async function findCodeAsync(id){id=String(id||'').trim().toLowerCase();const c=findCode(id);if(c)return c;if(!id.includes('@'))return null;
  try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(id));const h=Array.from(new Uint8Array(b),x=>x.toString(16).padStart(2,'0')).join('').slice(0,20);return EMAILH[h]||null}catch(e){return null}}
function login(id){
  const code=findCode(id);
  if(!code){S.ui.loginErr='ไม่พบอีเมลหรือรหัสพนักงานนี้ในรายชื่อเวรอาสา กรุณาตรวจสอบอีกครั้ง';render();return}
  S.ui.loginCode=null;S.user=code;S.sessAt=Date.now();audit('เข้าสู่ระบบ',code);S.admin=false;S.ui.adminGate=false;S.view='cal';S.ui.loginErr='';S.ui.choice=null;window.scrollTo(0,0);render()}

const FORMS=['adminForm','pwForm','regForm','loginForm'];
let busy=false;
async function handleForm(fid){if(busy)return;busy=true;try{await doForm({target:{id:fid},preventDefault(){}})}catch(err){S.ui.loginErr='เกิดข้อผิดพลาด กรุณาลองใหม่อีกครั้ง';render()}finally{busy=false}}
document.addEventListener('submit',e=>{e.preventDefault();if(FORMS.includes(e.target.id))handleForm(e.target.id)});

async function doForm(e){
  if(e.target.id==='adminForm'){e.preventDefault();const pw=document.getElementById('adminPw').value;
    if(!S.adminPw){const pw2=document.getElementById('adminPw2').value;if(pw.length<6){S.ui.adminErr='รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร';render();return}if(pw!==pw2){S.ui.adminErr='รหัสผ่านทั้งสองช่องไม่ตรงกัน';render();return}
      S.adminPw=await hashPw(pw);S.admin=true;S.sessAt=Date.now();audit('เข้าสู่ส่วนผู้ดูแลระบบ','admin');S.ui.adminGate=false;S.ui.adminErr='';S.ui.aTab='dash';toast('กำหนดรหัสผ่านผู้ดูแลระบบแล้ว');render();return}
    if(await hashPw(pw)!==S.adminPw){S.ui.adminErr='รหัสผ่านไม่ถูกต้อง';render();return}
    S.admin=true;S.sessAt=Date.now();audit('เข้าสู่ส่วนผู้ดูแลระบบ','admin');S.ui.adminGate=false;S.ui.adminErr='';S.ui.aTab='dash';render();return}
  if(e.target.id==='pwForm'){e.preventDefault();const o=document.getElementById('pwOld').value,n=document.getElementById('pwNew').value,n2=document.getElementById('pwNew2').value;
    if(await hashPw(o)!==S.adminPw)S.ui.pwMsg='รหัสผ่านปัจจุบันไม่ถูกต้อง';else if(n.length<6)S.ui.pwMsg='รหัสผ่านใหม่ต้องมีอย่างน้อย 6 ตัวอักษร';else if(n!==n2)S.ui.pwMsg='รหัสผ่านใหม่ทั้งสองช่องไม่ตรงกัน';else{S.adminPw=await hashPw(n);S.ui.pwMsg='✓ เปลี่ยนรหัสผ่านแล้ว'}
    render();return}
  if(e.target.id==='regForm'){e.preventDefault();const g=id=>document.getElementById(id).value;
    const first=normName(g('rFirst')),last=normName(g('rLast')),code=await findCodeAsync(g('rId')),pw=g('rPw'),pw2=g('rPw2');
    const err=m=>{S.ui.loginErr=m;render()};
    if(!first||!last)return err('กรุณากรอกชื่อจริงและนามสกุล');
    if(!code)return err('ไม่พบอีเมลหรือรหัสพนักงานนี้ในทะเบียนพนักงาน กรุณาตรวจสอบอีกครั้ง หรือติดต่อฝ่ายความปลอดภัย');
    if(byCode[code][2]!==first+' '+last)return err('ชื่อ-นามสกุลไม่ตรงกับรหัสพนักงานนี้ในทะเบียน กรุณาตรวจสอบการสะกด');
    if(S.pw[code])return err('บัญชีนี้ลงทะเบียนแล้ว กรุณาเข้าสู่ระบบ หากท่านไม่ได้ลงทะเบียนด้วยตนเอง กรุณาแจ้งฝ่ายความปลอดภัยทันที');
    if(pw.length<6)return err('รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร');
    if(pw!==pw2)return err('รหัสผ่านทั้งสองช่องไม่ตรงกัน');
    const d=new Date();S.pw[code]={h:await hashPw(code+':'+pw),at:d.getDate()+' '+MS[d.getMonth()]+' '+(d.getFullYear()+543)};audit('ลงทะเบียนบัญชีใหม่',code);toast('ลงทะเบียนเรียบร้อย');login(code);return}
  if(e.target.id==='loginForm'){e.preventDefault();const code=await findCodeAsync(document.getElementById('loginId').value),pw=document.getElementById('loginPw').value;
    if(!code){S.ui.loginErr='ไม่พบอีเมลหรือรหัสพนักงานนี้ในทะเบียนพนักงาน';render();return}
    const p=S.pw[code];if(!p){S.ui.loginErr='บัญชีนี้ยังไม่ได้ลงทะเบียน กรุณาเลือก "ลงทะเบียนครั้งแรก"';render();return}
    const ok=p.h==='demo'?pw.length>0:(await hashPw(code+':'+pw))===p.h;if(!ok){S.ui.loginErr='รหัสผ่านไม่ถูกต้อง';render();return}
    login(code)}}

  try{r=await fetch(API_URL,{method:'POST',body:JSON.stringify(body),headers:{'Content-Type':'text/plain;charset=utf-8'},redirect:'follow'})}
  catch(e){setBusy(false);throw new Error('ไม่สามารถเชื่อมต่อระบบได้ กรุณาตรวจสอบสัญญาณอินเทอร์เน็ตแล้วลองใหม่')}
  try{j=await r.json()}catch(e){setBusy(false);throw new Error('ระบบไม่ตอบสนอง กรุณาลองใหม่อีกครั้ง')}
  setBusy(false);
  if(!j.ok){if(SESSION&&!['login','adminLogin','register'].includes(action)&&/(กรุณาเข้าสู่ระบบ|เข้าสู่ระบบใหม่)/.test(j.error))expire(j.error);throw new Error(j.error||'ไม่สามารถบันทึกข้อมูลได้')}
  return j.data}

function expire(msg){SESSION=null;try{localStorage.removeItem(SKEY)}catch(e){}const ui=S.ui;S=blankState();S.ui.loginErr=msg||'';render()}

/* ---------- load server data into the screen state ---------- */
const DIRTY={ins:new Set(),cab:new Set(),task:new Set(),log:false,assign:new Set()};
const TASKID={};          // date -> {key -> task_id}
function putName(e){if(!e||!e[0])return;byCode[e[0]]=e;byName[e[2]]=e;if(!EMP.some(x=>x[0]===e[0]))EMP.push(e)}
function loadRoster(ro){
  ROSTER.length=0;Object.keys(RMAP).forEach(k=>delete RMAP[k]);RESIGNED.length=0;
  const by={};
  ro.schedules.forEach(x=>by[x.duty_date]={date:x.duty_date,type:x.duty_type==='วันอาทิตย์'?'':x.duty_type,leaders:[],members:[],slots:[]});
  ro.members.forEach(m=>{const r=by[m.duty_date];if(!r)return;const role=m.role==='LEADER'?'หัวหน้าเวร':'ลูกเวร';
    let code=m.employee_code||null,name;
    if(!code&&m.replacement_code){code=m.replacement_code}           // vacant slot already filled by someone else
    if(code)name=byCode[code]?byCode[code][2]:code;
    else{const mm=/^ลาออก:\s*(.+)$/.exec(m.note||'');name=mm?mm[1]:'ตำแหน่งว่าง (รอระบุ)';if(mm&&!RESIGNED.includes(name))RESIGNED.push(name)}
    (role==='หัวหน้าเวร'?r.leaders:r.members).push(name);
    r.slots.push({name,code,role,repl:m.employee_code?m.replacement_code:'',replBy:m.replacement_set_by||''})});
  Object.values(by).sort((a,b)=>a.date<b.date?-1:1).forEach(r=>{r.slots.sort((a,b)=>(a.role==='หัวหน้าเวร'?0:1)-(b.role==='หัวหน้าเวร'?0:1));RMAP[r.date]=r;ROSTER.push([r.date,r.type,r.leaders,r.members])})}
slots=function(date){const r=RMAP[date];return r?r.slots.map(x=>({name:x.name,code:x.code,role:x.role})):[]};

function loadAttendance(rows,dates){
  dates.forEach(d=>Object.keys(S.att).forEach(k=>{if(k.startsWith(d+'|'))delete S.att[k]}));
  rows.forEach(a=>{const d=a.duty_date,base={at:tHMS(a.checkin_at),by:a.actor_code,photo:!!a.photo_url,out:tHMS(a.checkout_at)};
    if(a.status==='come'){S.att[d+'|'+a.actor_code]=Object.assign({st:'come'},base);
      if(a.photo_url&&a.photo_url!=='1')PHOTOS['att:'+d+'|'+a.actor_code]=thumb(a.photo_url);
      if(a.checkout_photo_url&&a.checkout_photo_url!=='1')PHOTOS['out:'+d+'|'+a.actor_code]=thumb(a.checkout_photo_url)}
    else if(a.status==='sub'){const m=/แทนโดย\s*(\d+)/.exec(a.reason||'');const slot=(RMAP[d]&&RMAP[d].slots.find(x=>x.code===a.slot_code))||{};
      S.att[d+'|'+a.slot_code]={st:'sub',sub:(m&&m[1])||slot.repl||'',at:base.at,by:a.actor_code,setBy:/ระบุโดยผู้ดูแลระบบ/.test(a.reason)?'admin':/ระบุโดยหัวหน้าเวร/.test(a.reason)?'leader':''}}
    else S.att[d+'|'+a.slot_code]={st:'absent',why:a.reason,at:base.at,by:a.actor_code}});
  // replacements written in the sheet ahead of time
  ROSTER.forEach(([d])=>RMAP[d].slots.forEach(x=>{if(x.repl&&x.code&&!S.att[d+'|'+x.code])S.att[d+'|'+x.code]={st:'sub',sub:x.repl,at:'',by:x.replBy||'',setBy:x.replBy==='admin'?'admin':''}}))}

function loadPlans(rows){S.plans={};(rows||[]).forEach(r=>S.plans[r.duty_date+'|'+r.slot_code]={plan:r.plan,sub:r.replacement_code,why:r.reason,at:thDT(r.updated_at),by:r.updated_by,acc:r.sub_accepted_at?thDT(r.sub_accepted_at):''})}
function loadDay(D,day,isAdmin){
  S.out[D]=day.outside.map(o=>({code:o.employee_code,type:o.type,why:o.reason,outAt:o.out_at,backAt:o.back_at}));
  const ins=S.insp[D]=S.insp[D]||{};const V={PASS:'P',FAIL:'F','N/A':'N'};
  Object.keys(ins).forEach(i=>{if(!DIRTY.ins.has(+i))delete ins[i]});
  day.inspections.forEach(r=>{const i=+r.area_no-1;if(DIRTY.ins.has(i))return;ins[i]={v:[r.doors_windows,r.lighting,r.electrical].map(x=>V[x]||null),by:r.recorded_by,at:tHM(r.recorded_at),note:r.note,sev:r.severity,photo:r.photo_url}});
  // cabinets + tasks
  const ex=day.tasks.filter(t=>t.kind!=='FIXED'&&t.duty_date===D),fx=day.tasks.filter(t=>t.kind==='FIXED').sort((a,b)=>a.task_id<b.task_id?-1:1);
  FIXED_TASKS.length=0;fx.forEach(t=>FIXED_TASKS.push([t.title,t.detail]));
  const km=TASKID[D]={};fx.forEach((t,i)=>km['f'+i]=t.task_id);ex.forEach((t,i)=>km['x'+i]=t.task_id);
  if(!DIRTY.assign.has(D))S.assign[D]={cab:day.assign.map(a=>a.cabinet_code),pub:day.assign.some(a=>a.published==='TRUE'),tasks:ex.map(t=>({t:t.title,d:t.detail,id:t.task_id}))};
  else S.assign[D].tasks=ex.map(t=>({t:t.title,d:t.detail,id:t.task_id}));
  const cr=S.cabRes[D]=S.cabRes[D]||{};Object.keys(cr).forEach(c=>{if(!DIRTY.cab.has(c))delete cr[c]});
  day.cabinets.forEach(r=>{if(DIRTY.cab.has(r.cabinet_code))return;cr[r.cabinet_code]={st:r.result,f:r.faults?r.faults.split(', ').filter(Boolean):[],note:r.note,by:r.checked_by,at:tHM(r.checked_at),photo:r.photo_url};if(isAdmin&&r.photo_url)PHOTOS['cab:'+r.cabinet_code]=thumb(r.photo_url)});
  const rk={};Object.entries(km).forEach(([k,id])=>rk[id]=k);
  const tr=S.taskRes[D]=S.taskRes[D]||{};Object.keys(tr).forEach(k=>{if(!DIRTY.task.has(k))delete tr[k]});
  day.taskResults.forEach(r=>{const k=rk[r.task_id];if(!k||DIRTY.task.has(k))return;tr[k]={st:r.result,note:r.note,by:r.reported_by,at:tHM(r.reported_at),photo:r.photo_url}});
  // duty log
  const lg=day.log||{};
  const events=day.events.map(e=>({t:e.time,x:e.text,by:e.recorded_by}));
  if(DIRTY.log&&S.log[D])S.log[D].events=events;
  else S.log[D]={pump:lg.pump_result||'',pumpWhy:lg.pump_reason||'',pumpBy:lg.updated_by||'',t1:lg.test_start||'',t2:lg.test_end||'',sug:lg.suggestion||'',ecab:[],events,
    works:day.contractors.map((c,i)=>{const urls=(c.photo_urls||'').split(' ').filter(Boolean);return {p:c.place,j:c.job,id:'c'+i,urls,photos:urls.length}})};
  const t=day.team;S.team[D]=t?{at:tHM(t.taken_at),by:t.taken_by,codes:(t.in_photo_codes||'').split(',').filter(Boolean),total:+t.present_count||0}:null;
  if(t&&isAdmin&&t.photo_url)PHOTOS['team:'+D]=thumb(t.photo_url);
  if(!S.team[D])delete S.team[D]}

async function pull(){
  if(!SESSION)return;
  try{
    if(SESSION.role==='admin'){const d=await api('adminBootstrap');TODAY=d.date;
      EMP.length=0;d.employees.forEach(e=>putName([e.code,e.title,e.name,e.department]));
      S.pw={};d.employees.forEach(e=>{if(e.registered_at)S.pw[e.code]={at:thDT(e.registered_at).split(' ').slice(0,3).join(' ')}});
      loadRoster(d.roster);S.att={};loadAttendance(d.attendance,[]);
      S.team={};d.team.forEach(t=>S.team[t.duty_date]={at:tHM(t.taken_at),by:t.taken_by,codes:(t.in_photo_codes||'').split(',').filter(Boolean),total:+t.present_count||0});
      S.approve={};d.approvals.forEach(a=>S.approve[a.month]={check:thDT(a.checked_at),approve:thDT(a.approved_at)});
      Object.keys(S.assign).forEach(k=>{if(!DIRTY.assign.has(k))delete S.assign[k]});
      const byD={};d.assign.forEach(a=>(byD[a.duty_date]=byD[a.duty_date]||[]).push(a));
      d.tasks.filter(t=>t.kind!=='FIXED').forEach(t=>byD[t.duty_date]=byD[t.duty_date]||[]);
      Object.entries(byD).forEach(([dd,rows])=>{if(dd===d.date)return;const ex=d.tasks.filter(t=>t.kind!=='FIXED'&&t.duty_date===dd);
        TASKID[dd]={};ex.forEach((t,i)=>TASKID[dd]['x'+i]=t.task_id);
        if(!DIRTY.assign.has(dd))S.assign[dd]={cab:rows.map(a=>a.cabinet_code),pub:rows.some(a=>a.published==='TRUE'),tasks:ex.map(t=>({t:t.title,d:t.detail,id:t.task_id}))}});
      loadDay(d.work_date||d.date,d.day,true);loadPlans(d.plans);
      S.lastCab={};Object.entries(d.lastCab).forEach(([c,dd])=>S.lastCab[c]=MS[+dd.slice(5,7)-1]);
      const c=d.config;Object.assign(S.cfg,{gps:String(c.gps).toUpperCase()==='TRUE',lat:c.lat,lng:c.lng,radius:c.radius||300,rateA:c.rateA||1500,rateB:c.rateB||1100,signer1:c.signer1,signer2:c.signer2});
      if(!S.assign[S.ui.aDate]&&!(RMAP[S.ui.aDate])){S.ui.aDate=RMAP[TODAY]?TODAY:(ROSTER.map(r=>r[0]).find(x=>x>TODAY)||TODAY)}
      if(S.ui.aTab==='audit')await loadAudit()}
    else{const d=await api('bootstrap');TODAY=d.date;
      EMP.length=0;Object.values(d.names).forEach(putName);
      loadRoster(d.roster);S.att={};loadAttendance(d.day.attendance,[d.work_date||d.date]);loadDay(d.work_date||d.date,d.day,false);loadPlans(d.plans);
      const c=d.config;Object.assign(S.cfg,{gps:String(c.gps).toUpperCase()==='TRUE',lat:c.lat,lng:c.lng,radius:c.radius||300})}
    if(S.ui.loading){S.ui.loading=false;if(SESSION.view)S.view=SESSION.view;if(SESSION.aTab)S.ui.aTab=SESSION.aTab;S.ui.cal={y:+TODAY.slice(0,4),m:+TODAY.slice(5,7)-1,sel:TODAY,mine:false};S.ui.allowM=TODAY.slice(0,7)}
  }catch(e){if(S.ui.loading&&SESSION){S.ui.loading=false;S.ui.loadErr=e.message}else if(SESSION)toastErr(e.message)}
  render()}

/* ---------- saving work records ---------- */
const P2S={P:'PASS',F:'FAIL',N:'N/A'};
async function saveArea(i,quiet){
  const D=wd(),r=(S.insp[D]||{})[i];if(!r)return;DIRTY.ins.add(i);
  if(r.v.some(x=>!x))return;                                   // wait until all 3 categories are set
  if(r.v.includes('F')&&!(r.note||'').trim())return;           // FAIL needs a description first
  try{await api('saveInspection',{area_no:i+1,area_name:AREAS[i],doors_windows:P2S[r.v[0]],lighting:P2S[r.v[1]],electrical:P2S[r.v[2]],note:r.note||'',severity:r.sev||'',photo:r.newPhoto||''});
    delete r.newPhoto;r.photo=r.photo||'1';DIRTY.ins.delete(i);if(!quiet)toast('บันทึกผล '+AREAS[i]+' แล้ว')}
  catch(e){toastErr(e.message)}}
async function saveCab(code){
  const D=wd(),v=(S.cabRes[D]||{})[code];if(!v||!v.st)return;DIRTY.cab.add(code);
  if(!v.photo&&!v.newPhoto)return;
  try{await api('saveCabinet',{code,result:v.st,faults:v.f||[],note:v.note||'',photo:v.newPhoto||''});delete v.newPhoto;v.photo=v.photo||'1';DIRTY.cab.delete(code);toast('บันทึกผลตู้ '+code+' แล้ว')}
  catch(e){toastErr(e.message)}}
async function saveTask(k){
  const D=wd(),v=(S.taskRes[D]||{})[k];if(!v||!v.st)return;DIRTY.task.add(k);
  const id=(TASKID[D]||{})[k];if(!id)return;
  try{await api('saveTask',{task_id:id,result:v.st,note:v.note||'',photo:v.newPhoto||''});delete v.newPhoto;DIRTY.task.delete(k)}
  catch(e){toastErr(e.message)}}
async function saveLog(quiet){
  const D=wd(),L=S.log[D];if(!L)return;
  try{await api('saveDutyLog',{pump:L.pump,pumpWhy:L.pumpWhy||'',t1:L.t1||'',t2:L.t2||'',sug:L.sug||'',works:L.works.filter(w=>(w.p||'').trim()||(w.j||'').trim()).map(w=>({p:w.p||'',j:w.j||'',photos:[...(w.urls||[]),...(w.newPhotos||[])]}))});
    DIRTY.log=false;Object.keys(PHOTOS).forEach(k=>{if(k.startsWith('work:'))delete PHOTOS[k]});if(!quiet)toast('บันทึกการอยู่เวรแล้ว');await pull()}
  catch(e){toastErr(e.message)}}

/* ---------- clicks: changes go to the server ---------- */
let Q=Promise.resolve(),PB=false;
const run=fn=>{Q=Q.then(fn).catch(e=>{toastErr(e.message);render()});return Q};
const runB=fn=>{if(PB)return;PB=true;run(async()=>{try{await fn()}finally{PB=false}})};
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const d=b.dataset,u=S.ui,D=TODAY,me=S.user;
  const stop=()=>{e.stopPropagation();e.preventDefault()};
  const after=fn=>setTimeout(fn,0);                              // let the screen update first, then save
  switch(d.act){
   case 'retryLoad':stop();S.ui.loading=true;render();pull();return;
   case 'reset':stop();return;
   case 'logout':stop();runB(async()=>{try{await api('logout')}catch(x){}SESSION=null;try{localStorage.removeItem(SKEY)}catch(x){}S=blankState();render()});return;
   case 'submitAtt':stop();runB(async()=>{
     if(d.c==='come'){const photo=PHOTOS['att:draft'];if(!photo){toastErr('กรุณาถ่ายรูปลงชื่อรับทราบก่อน');return}
       u.gpsErr='';let gps=null;try{gps=await getPos()}catch(x){u.gpsErr=x.message;render();return}
       try{await api('confirmAttendance',{status:'come',photo,photoTakenAt:u.shotMs||Date.now(),gps})}catch(x){u.gpsErr=x.message;render();throw x}
       PHOTOS['att:'+D+'|'+me]=photo;delete PHOTOS['att:draft']}
     else if(d.c==='sub')await api('confirmAttendance',{status:'sub',sub:u.subPick});
     else await api('confirmAttendance',{status:'absent',reason:u.why.trim()});
     u.choice=null;u.subQ='';u.subPick=null;u.why='';toast('ส่งข้อมูลถึงผู้ดูแลระบบแล้ว');await pull()});return;
   case 'undoAtt':stop();runB(async()=>{await api('undoAttendance');u.choice=null;delete PHOTOS['att:'+D+'|'+me];toast('ยกเลิกสถานะเดิมแล้ว กรุณาเลือกสถานะใหม่');await pull()});return;
   case 'leadSub':stop();runB(async()=>{await api('setSubstitute',{slot:d.code,sub:u.lpick});u.leadFor=null;toast('บันทึกผู้เข้าเวรแทนแล้ว');await pull()});return;
   case 'adminSubSave':stop();runB(async()=>{await api('setSubstitute',{slot:d.code,sub:u.apick});u.aSubFor=null;toast('บันทึกผู้เข้าเวรแทนแล้ว');await pull()});return;
   case 'checkout':stop();runB(async()=>{const photo=PHOTOS['out:draft'];if(!photo)return;let gps=null;try{gps=await getPos()}catch(x){toastErr(x.message);return}
     await api('checkout',{photo,photoTakenAt:u.shotMs||Date.now(),gps});PHOTOS['out:'+D+'|'+me]=photo;delete PHOTOS['out:draft'];toast('ลงชื่อออกเวรแล้ว');await pull()});return;
   case 'goOut':stop();runB(async()=>{await api('goOutside',{type:u.outType,reason:u.outType==='อื่นๆ'?u.outWhy.trim():''});u.outWhy='';toast('บันทึกออกนอกโรงงานแล้ว');await pull()});return;
   case 'goBack':stop();runB(async()=>{const r=await api('backInside');toast(r&&r.over?'กลับแล้ว · ใช้เวลา '+r.minutes+' นาที (เกิน 1 ชม.)':'ยืนยันกลับเข้าโรงงานแล้ว');await pull()});return;
   case 'teamSave':stop();runB(async()=>{const photo=PHOTOS['team:draft'];if(!photo)return;
     await api('saveTeamPhoto',{photo,codes:(u.teamSel||[]).slice()});PHOTOS['team:'+D]=photo;delete PHOTOS['team:draft'];u.teamSel=null;u.teamRetake=false;toast('ส่งรูปยืนยันการอยู่เวรแล้ว');await pull()});return;
   case 'teamRedo':stop();u.teamRetake=true;u.teamSel=null;render();return;
   case 'evAdd':stop();runB(async()=>{if(!u.newEv.trim())return;await api('addEvent',{text:u.newEv.trim()});u.newEv='';toast('บันทึกเหตุการณ์แล้ว');await pull()});return;
   case 'logSave':stop();runB(()=>saveLog(false));return;
   case 'logSet':DIRTY.log=true;after(()=>run(()=>saveLog(true)));return;
   case 'workAdd':case 'workDel':DIRTY.log=true;return;
   case 'insAll':after(()=>run(()=>saveArea(+d.i,true)));return;
   case 'insSet':case 'insSev':DIRTY.ins.add(+d.i);after(()=>run(()=>saveArea(+d.i)));return;
   case 'cabSet':case 'cabFault':DIRTY.cab.add(d.code);after(()=>run(()=>saveCab(d.code)));return;
   case 'taskSet':DIRTY.task.add(d.k);after(()=>run(()=>saveTask(d.k)));return;
   case 'aCab':case 'aClear':case 'aAuto':DIRTY.assign.add(u.aDate);return;
   case 'aPub':stop();runB(async()=>{const a=S.assign[u.aDate];await api('assignCabinets',{date:u.aDate,codes:a.cab,publish:true});DIRTY.assign.delete(u.aDate);toast('ประกาศงานเรียบร้อยแล้ว');await pull()});return;
   case 'aTaskAdd':stop();runB(async()=>{await api('addTask',{date:u.aDate,title:u.dT.trim(),detail:u.dD.trim()});u.dT='';u.dD='';toast('เพิ่มงานพิเศษแล้ว');await pull()});return;
   case 'aTaskDel':stop();runB(async()=>{const t=S.assign[u.aDate].tasks[+d.i];if(!t||!t.id)return;await api('removeTask',{task_id:t.id});toast('ลบงานแล้ว');await pull()});return;
   case 'aCheck':stop();runB(async()=>{await api('approveAllowance',{month:d.d,step:'check',by:S.cfg.signer1||''});toast('บันทึกการเสนอแล้ว');await pull()});return;
   case 'aApprove':stop();runB(async()=>{await api('approveAllowance',{month:d.d,step:'approve',by:S.cfg.signer2||''});toast('บันทึกการอนุมัติแล้ว');await pull()});return;
   case 'pwReset':stop();runB(async()=>{await api('resetAccount',{code:d.code});toast('รีเซ็ตการลงทะเบียนของ '+nm(d.code)+' แล้ว');await pull()});return;
   case 'cfgGps':stop();runB(async()=>{if(d.v==='1'&&(!S.cfg.lat||!S.cfg.lng)){toastErr('กรุณากำหนดพิกัดโรงงานก่อนเปิดใช้งาน');return}await api('setConfig',{key:'GPS_ENABLED',value:d.v==='1'?'TRUE':'FALSE'});S.cfg.gps=d.v==='1';toast('บันทึกการตั้งค่าแล้ว');render()});return;
   case 'cfgHere':stop();if(!navigator.geolocation){toastErr('อุปกรณ์นี้ไม่รองรับการระบุตำแหน่ง');return}
     navigator.geolocation.getCurrentPosition(p=>run(async()=>{const la=p.coords.latitude.toFixed(6),lo=p.coords.longitude.toFixed(6);await api('setConfig',{key:'FACTORY_LATITUDE',value:la});await api('setConfig',{key:'FACTORY_LONGITUDE',value:lo});S.cfg.lat=la;S.cfg.lng=lo;toast('บันทึกพิกัดโรงงานแล้ว');render()}),()=>toastErr('ไม่สามารถเข้าถึงตำแหน่งได้ กรุณากรอกพิกัดด้วยตนเอง'),{enableHighAccuracy:true,timeout:15000});return;
   case 'planSave':stop();runB(async()=>{const c=u.planChoice;if(!c)return;await api('planDuty',{date:d.d,plan:c,sub:c==='sub'?u.ppick:'',reason:c==='leave'?(u.pwhy||'').trim():''});u.planEdit=null;u.planChoice=null;u.ppick=null;u.pq='';u.pwhy='';toast('บันทึกการแจ้งแล้ว');await pull()});return;
   case 'planAccept':stop();runB(async()=>{await api('acceptSub',{date:d.d});toast('รับทราบการเข้าเวรแทนแล้ว');await pull()});return;
   case 'aPlanSave':stop();runB(async()=>{const [dd,slot]=d.k.split('|');await api('adminPlanSub',{date:dd,slot,sub:u.apick2});u.pSubFor=null;toast('บันทึกผู้เข้าเวรแทนแล้ว');await pull()});return;
   case 'aTab':if(d.t==='audit')after(()=>run(async()=>{await loadAudit();render()}));return;
   case 'nav':after(()=>{if(['today','inspect','special','log'].includes(S.view))run(pull)});return;
  }},true);

/* ---------- typing / files ---------- */
const CFGKEY={cfgLat:'FACTORY_LATITUDE',cfgLng:'FACTORY_LONGITUDE',cfgR:'GEOFENCE_RADIUS',rateA:'RATE_A',rateB:'RATE_B',sg1:'SIGNER_1',sg2:'SIGNER_2'};
document.addEventListener('change',e=>{const t=e.target,b=t.dataset.bind||'';
  if(CFGKEY[t.id]){run(async()=>{await api('setConfig',{key:CFGKEY[t.id],value:t.value.trim()});toast('บันทึกการตั้งค่าแล้ว')});return}
  if(b.startsWith('insNote:')){after0(()=>run(()=>saveArea(+b.split(':')[1])));return}
  if(b.startsWith('cabNote:')){after0(()=>run(()=>saveCab(b.split(':')[1])));return}
  if(b.startsWith('taskNote:')){after0(()=>run(()=>saveTask(b.split(':')[1])));return}
  if(t.dataset.file){const [k,id]=t.dataset.file.split(':'),files=[...(t.files||[])];if(!files.length)return;
    if(k==='att'||k==='outp'||k==='team'){S.ui.shotMs=files[0].lastModified;return}   // the page stamps the photo itself
    e.stopPropagation();const D=wd();
    if(k==='ins'){photoOf(files[0],'ตรวจพื้นที่ '+AREAS[+id]).then(url=>{const r=S.insp[D][+id];if(!r)return;r.newPhoto=url;r.photo='1';PHOTOS['ins:'+id]=url;run(()=>saveArea(+id))});return}
    if(k==='cab'){photoOf(files[0],'ตรวจตู้สายน้ำ '+id).then(url=>{const r=S.cabRes[D][id]=S.cabRes[D][id]||{f:[]};r.newPhoto=url;r.photo=r.photo||'1';PHOTOS['cab:'+id]=url;render();run(()=>saveCab(id))});return}
    if(k==='task'){photoOf(files[0],'งานพิเศษ').then(url=>{const r=S.taskRes[D][id]=S.taskRes[D][id]||{};r.newPhoto=url;toast('แนบรูปแล้ว');if(r.st)run(()=>saveTask(id))});return}
    if(k==='work'){const w=S.log[D].works.find(x=>x.id===id);if(!w)return;DIRTY.log=true;
      Promise.all(files.slice(0,5).map(f=>photoOf(f,'การปฏิบัติงาน'))).then(urls=>{w.newPhotos=[...(w.newPhotos||[]),...urls];const arr=PHOTOS['work:'+id]=PHOTOS['work:'+id]||[];arr.push(...urls);w.photos=(w.urls||[]).length+w.newPhotos.length;toast('แนบรูปแล้ว · กด "บันทึก" ท้ายหน้าเพื่อส่งข้อมูล');render()});return}
  }},true);
const after0=fn=>setTimeout(fn,0);
document.addEventListener('input',e=>{const b=e.target.dataset.bind||'';
  if(b.startsWith('log:')||b.startsWith('work:'))DIRTY.log=true;
  if(['subQ','lq','aq','pq','aq2'].includes(b))searchSoon(e.target.value)},true);
let sT=null;const SEEN=new Set();
function searchSoon(q){q=q.trim();clearTimeout(sT);if(!q||SEEN.has(q))return;sT=setTimeout(async()=>{try{const r=await api('searchEmployees',{q});SEEN.add(q);let add=false;r.forEach(e=>{if(!byCode[e[0]])add=true;putName(e)});if(add)render()}catch(x){}},350)}

/* ---------- sign-in forms ---------- */
doForm=async function(e){const id=e.target.id,g=x=>(document.getElementById(x)||{}).value||'';
  if(id==='loginForm'){S.ui.loginErr='';const lid=g('loginId').trim(),pw=g('loginPw');
    if(!lid||!pw){S.ui.loginErr='กรุณากรอกอีเมลหรือรหัสพนักงาน และรหัสผ่าน';render();return}
    try{await startSession(await api('login',{id:lid,password:pw}))}catch(x){S.ui.loginErr=x.message;render()}return}
  if(id==='regForm'){S.ui.loginErr='';const first=normName(g('rFirst')),last=normName(g('rLast')),rid=g('rId').trim(),pw=g('rPw'),pw2=g('rPw2');
    const err=m=>{S.ui.loginErr=m;render()};
    if(!first||!last)return err('กรุณากรอกชื่อจริงและนามสกุล');if(!rid)return err('กรุณากรอกอีเมลบริษัท หรือรหัสพนักงาน');
    if(pw.length<6)return err('รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร');if(pw!==pw2)return err('รหัสผ่านทั้งสองช่องไม่ตรงกัน');
    try{const d=await api('register',{first,last,id:rid,password:pw});toast('ลงทะเบียนเรียบร้อย');await startSession(d)}catch(x){err(x.message)}return}
  if(id==='adminForm'){S.ui.adminErr='';const pw=g('adminPw');if(!pw){S.ui.adminErr='กรุณากรอกรหัสผ่าน';render();return}
    try{await startSession(await api('adminLogin',{password:pw}))}catch(x){S.ui.adminErr=x.message;render()}return}
  if(id==='pwForm'){const o=g('pwOld'),n=g('pwNew'),n2=g('pwNew2');
    if(n.length<6)S.ui.pwMsg='รหัสผ่านใหม่ต้องมีอย่างน้อย 6 ตัวอักษร';else if(n!==n2)S.ui.pwMsg='รหัสผ่านใหม่ทั้งสองช่องไม่ตรงกัน';
    else{try{await api('adminChangePassword',{old:o,password:n});S.ui.pwMsg='✓ เปลี่ยนรหัสผ่านแล้ว'}catch(x){S.ui.pwMsg=x.message}}
    render()}};

/* ---------- keep the screen current ---------- */
setInterval(()=>{if(!SESSION||INFLIGHT||document.hidden)return;const a=document.activeElement;if(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))return;
  if(SESSION.role==='admin'?['dash','special','inspect'].includes(S.ui.aTab):['today','inspect','special','log'].includes(S.view))pull()},60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&SESSION&&!INFLIGHT)pull()});

/* ---------- start ---------- */
if(SESSION&&SESSION.exp&&Date.parse(SESSION.exp)>Date.now()){
  S.sessAt=Date.parse(SESSION.exp)-H12;if(SESSION.role==='admin')S.admin=true;else S.user=SESSION.code;S.ui.loading=true;render();pull()}
else{SESSION=null;try{localStorage.removeItem(SKEY)}catch(e){}render()}

</script>
